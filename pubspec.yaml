name: chitt
description: "Chitt - a private journal for things that hit you throughout the day."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  go_router: ^18.0.1
  freezed_annotation: ^3.1.0
  record: ^7.1.1
  just_audio: ^0.10.6
  geolocator: ^14.0.3
  http: ^1.2.2
  intl: ^0.20.2
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.0.0
  drift_dev: ^2.35.0
  freezed: ^4.0.1
  flutter_lints: ^6.0.0
  just_audio_platform_interface: ^4.6.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#191714"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 24
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#191714"
  web:
    generate: true
    background_color: "#191714"
    theme_color: "#191714"

flutter:
  uses-material-design: true

  # The outline atlas behind find's first screen — ADR-089. Natural Earth, which
  # is public domain, so nothing has to be credited on screen. Regenerated by
  # tool/pack_outlines.mjs; docs/PACKAGES.md says how.
  assets:
    - assets/geo/outline.bin

  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader/Newsreader-VF.ttf
        - asset: assets/fonts/Newsreader/Newsreader-Italic-VF.ttf
          style: italic
    - family: Hanken Grotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk/HankenGrotesk-VF.ttf
    - family: Noto Serif Devanagari
      fonts:
        - asset: assets/fonts/NotoSerifDevanagari/NotoSerifDevanagari-VF.ttf
