name: chit
description: "Chitta - a private journal for things that hit you throughout the day."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  go_router: ^18.0.1
  freezed_annotation: ^3.1.0
  record: ^7.1.1
  just_audio: ^0.10.6
  geolocator: ^14.0.3
  http: ^1.2.2
  intl: ^0.20.2
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.0.0
  drift_dev: ^2.35.0
  freezed: ^4.0.1
  flutter_lints: ^6.0.0
  just_audio_platform_interface: ^4.6.0

flutter:
  uses-material-design: true
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader/Newsreader-VF.ttf
        - asset: assets/fonts/Newsreader/Newsreader-Italic-VF.ttf
          style: italic
    - family: Hanken Grotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk/HankenGrotesk-VF.ttf
    - family: Noto Serif Devanagari
      fonts:
        - asset: assets/fonts/NotoSerifDevanagari/NotoSerifDevanagari-VF.ttf
