# Static analysis for chit. `flutter analyze` must be clean before every
# commit — CLAUDE.md §0.
#
# The rules below are the engineering principles of CLAUDE.md §4.1 in the form
# the machine can check. Where a principle cannot be a lint, it is a test
# instead: ADR-012's ban on `DateTime.now()` is
# `test/core/clock_is_the_only_now_test.dart`, and README §6.4's contrast floor
# is `test/core/theme/contrast_test.dart`.

include: package:flutter_lints/flutter.yaml

# riverpod_lint 3.x is an analysis-server plugin, not a custom_lint rule set
# (ADR-018). Declaring it here is what makes `flutter analyze` report the
# Riverpod lints; there is no separate command to run.
plugins:
  riverpod_lint: ^3.1.9

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # An unawaited future is a race, not a style preference.
    unawaited_futures: error
    # A missing case in a switch over a sealed type or an enum is exactly the
    # open/closed failure CLAUDE.md §4.1 warns about: a new WeatherCondition
    # must not ship silently unhandled.
    non_exhaustive_switch_statement: error
    non_exhaustive_switch_expression: error
    # Documentation that points at something that no longer exists is worse
    # than no documentation.
    dangling_library_doc_comments: error

linter:
  rules:
    # ── Immutability by default ────────────────────────────────────────────
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    avoid_final_parameters: true

    # ── Say what you mean ──────────────────────────────────────────────────
    always_declare_return_types: true
    avoid_positional_boolean_parameters: true
    unnecessary_parenthesis: true
    unnecessary_lambdas: true
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_constructors_first: true
    directives_ordering: true
    combinators_ordering: true

    # ── Correctness ────────────────────────────────────────────────────────
    always_use_package_imports: false
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    only_throw_errors: true
    throw_in_finally: true
    test_types_in_equals: true
    avoid_type_to_string: true
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    use_build_context_synchronously: true

    # ── Flutter ────────────────────────────────────────────────────────────
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true
    use_colored_box: true
    use_decorated_box: true
    use_full_hex_values_for_flutter_colors: true

    # ── Documentation ──────────────────────────────────────────────────────
    # Every public API carries a doc comment. This codebase argues with itself
    # in comments on purpose; the rule is there so the argument keeps happening.
    public_member_api_docs: true
    comment_references: true
